<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小算盘：购物省钱助手</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #222; background: #fafafa; line-height: 1.7; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 2em; margin: 0 0 8px; }
  .lead { font-size: 1.15em; color: #555; margin: 0 0 32px; }
  h2 { font-size: 1.15em; margin: 28px 0 8px; }
  ol, ul { padding-left: 1.3em; }
  footer { margin-top: 48px; color: #888; font-size: 0.9em; }
</style>
</head>
<body>
<main>
  <h1>小算盘</h1>
  <p class="lead">面向个人消费者的购物省钱助手：你说想买什么，它帮你算券后价。</p>

  <h2>怎么用</h2>
  <ol>
    <li>在对话里说出想买的商品，比如"抽纸 3 提"。</li>
    <li>小算盘通过电商平台官方开放的推广接口搜索商品，比较各商品的券后价。</li>
    <li>给出带推广位的商品链接，你点击后跳转到官方商品页面，自己下单付款。</li>
  </ol>

  <h2>我们不做的事</h2>
  <ul>
    <li>不代用户下单，也不代用户付款。</li>
    <li>不收集用户的支付信息、账号密码或收货地址。</li>
  </ul>

  <footer>小算盘</footer>
</main>
</body>
</html>
