<style>

  body { margin:0; font:14px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px 8px; }
  h1 { margin:0 0 4px; font-size:20px; }
  .sub { color:var(--muted); margin:0; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 24px; }
  .chip { border-left:4px solid var(--c); padding:2px 10px; background:var(--card); border-radius:4px; }
  .key { color:var(--muted); margin-left:8px; }
  .key b { color:var(--fg); font-weight:600; }
  main { display:grid; grid-template-columns: 1fr 340px; gap:16px; padding:8px 24px 24px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .canvas { background:var(--card); border-radius:12px; overflow:auto; }
  svg { display:block; width:100%; height:auto; min-width:1000px; }
  .node rect { fill:var(--card); stroke:var(--c); stroke-width:2.5; cursor:pointer; }
  .node:focus { outline:none; }
  .node:focus rect, .node.on rect { stroke-width:4; fill:color-mix(in srgb, var(--c) 14%, var(--card)); }
  .nlabel { text-anchor:middle; font-weight:600; font-size:15px; fill:var(--fg); pointer-events:none; }
  .edge path { fill:none; stroke:var(--line); stroke-width:1.6; }
  .edge path.many { stroke-dasharray:6 4; }
  .elabel { font-size:11.5px; fill:var(--muted); text-anchor:middle; paint-order:stroke; stroke:var(--card); stroke-width:4px; }
  .dim .edge, .dim .node { opacity:.18; }
  .dim .edge.on, .dim .node.on, .dim .node.near { opacity:1; }
  .edge.on path { stroke:var(--hl); stroke-width:2.4; }
  .edge.on .elabel { fill:var(--fg); font-weight:600; }
  aside { background:var(--card); border-radius:12px; padding:16px; align-self:start; position:sticky; top:12px; }
  aside h2 { margin:0 0 2px; font-size:17px; }
  aside h3 { margin:14px 0 4px; font-size:13px; color:var(--muted); font-weight:600; }
  aside ul { margin:0; padding-left:0; list-style:none; }
  aside li { font:12.5px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; padding:3px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 25%, transparent); word-break:break-all; }
  .empty { color:var(--muted); }
  footer { color:var(--muted); padding:0 24px 24px; font-size:12.5px; }
  code { font-family: ui-monospace, Consolas, monospace; }
</style>

<script>
const D = {"Store":{"group":"门店","out":["store_product_search(Store , String) : set(Product)","store_product_attribute_option(Store , Product , Attribute) : set(Option)","product_defaultsku(Store , Product) : Sku","sku_switch(Store , Sku , Option) : Sku"],"in":["quote_store(Quote) : Store","order_store(Order) : Store"],"attrs":["store_name(Store) : String","store_address(Store) : String","store_coordinate(Store) : Coordinate","store_opentime(Store) : Time","store_closetime(Store) : Time","is_store_open(Store , DateTime) : Bool","is_store_delivery_supported(Store) : Bool","store_distance(Store , Coordinate) : Number","is_product_search_fallback(Store , String , Product) : Bool","store_product_initialprice(Store , Product) : Price","is_product_option_selectable(Store , Product , Option) : Bool"]},"Product":{"group":"商品与规格","out":["product_attribute(Product) : set(Attribute)","product_attribute_defaultoption(Product , Attribute) : Option"],"in":["store_product_search(Store , String) : set(Product)","sku_product(Sku) : Product","orderline_product(OrderLine) : Product"],"attrs":["product_name(Product) : String","is_product_new(Product) : Bool","product_option_extraprice(Product , Option) : Price"]},"Attribute":{"group":"商品与规格","out":["attribute_option(Attribute) : set(Option)"],"in":["product_attribute(Product) : set(Attribute)","option_attribute(Option) : Attribute"],"attrs":[]},"Option":{"group":"商品与规格","out":["option_attribute(Option) : Attribute"],"in":["attribute_option(Attribute) : set(Option)","store_product_attribute_option(Store , Product , Attribute) : set(Option)","product_attribute_defaultoption(Product , Attribute) : Option","sku_option(Sku) : set(Option)"],"attrs":[]},"Sku":{"group":"商品与规格","out":["sku_product(Sku) : Product","sku_option(Sku) : set(Option)"],"in":["product_defaultsku(Store , Product) : Sku","sku_switch(Store , Sku , Option) : Sku","orderline_sku(OrderLine) : Sku"],"attrs":[]},"OrderLine":{"group":"报价与券","out":["orderline_sku(OrderLine) : Sku","orderline_product(OrderLine) : Product"],"in":["quote_orderline(Quote) : set(OrderLine)","order_orderline(Order) : set(OrderLine)"],"attrs":["orderline_amount(OrderLine) : Number"]},"Quote":{"group":"报价与券","out":["quote_store(Quote) : Store","quote_orderline(Quote) : set(OrderLine)","quote_coupon(Quote) : set(Coupon)"],"in":[],"attrs":["quote_initialprice(Quote) : Price","quote_payprice(Quote) : Price","quote_discount(Quote) : Price","quote_time(Quote) : DateTime"]},"Coupon":{"group":"报价与券","out":["coupon_order(Coupon) : set(Order)"],"in":["quote_coupon(Quote) : set(Coupon)","order_coupon(Order) : set(Coupon)"],"attrs":["is_coupon_occupied(Coupon , DateTime) : Bool"]},"Order":{"group":"订单","out":["order_store(Order) : Store","order_orderline(Order) : set(OrderLine)","order_coupon(Order) : set(Coupon)","order_status(Order , DateTime) : OrderStatus"],"in":["coupon_order(Coupon) : set(Order)"],"attrs":["order_payprice(Order) : Price","order_createtime(Order) : DateTime","order_pickuptime(Order) : DateTime","order_pickupcode(Order) : String","order_payqrcodeurl(Order) : String","order_paydeeplink(Order) : String","is_order_payment_needed(Order) : Bool","is_order_allowed(Order) : Bool"]},"OrderStatus":{"group":"订单","out":[],"in":["order_status(Order , DateTime) : OrderStatus"],"attrs":[]}};
const svg = document.getElementById("g"), side = document.getElementById("side");
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const list = (t, xs) => "<h3>" + t + "（" + xs.length + "）</h3>" + (xs.length ? "<ul>" + xs.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : '<p class="empty">无</p>');
function pick(c) {
  svg.classList.toggle("dim", !!c);
  svg.querySelectorAll(".on,.near").forEach((n) => n.classList.remove("on", "near"));
  if (!c) { side.innerHTML = '<h2>点一个概念</h2><p class="empty">右侧会列出它的出边、入边和值属性。</p>'; return; }
  svg.querySelector('.node[data-c="' + c + '"]').classList.add("on");
  svg.querySelectorAll(".edge").forEach((e) => {
    if (e.dataset.from === c || e.dataset.to === c) {
      e.classList.add("on");
      svg.querySelector('.node[data-c="' + (e.dataset.from === c ? e.dataset.to : e.dataset.from) + '"]').classList.add("near");
    }
  });
  const d = D[c];
  side.innerHTML = "<h2>" + c + "</h2><p class='empty'>" + d.group + "</p>" + list("指向其他概念", d.out) + list("被其他概念指向", d.in) + list("值属性", d.attrs);
}
svg.addEventListener("click", (ev) => { const n = ev.target.closest(".node"); const c = n ? n.dataset.c : null; history.replaceState(null, "", c ? "#" + c : location.pathname); pick(c); });
// 链接里带 #概念名 时直接选中，方便在文档里链接到某个概念
if (D[location.hash.slice(1)]) pick(location.hash.slice(1));
svg.addEventListener("keydown", (ev) => { const n = ev.target.closest(".node"); if (n && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); pick(n.dataset.c); } if (ev.key === "Escape") pick(null); });
</script>
